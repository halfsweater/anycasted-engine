[workspace]
members = [".", "crates/*"]
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
anycasted-core = { path = "crates/anycasted-core" }
anycasted-ingestion = { path = "crates/anycasted-ingestion" }
anycasted-parser = { path = "crates/anycasted-parser" }
anycasted-detection = { path = "crates/anycasted-detection" }
anycasted-analysis = { path = "crates/anycasted-analysis" }
anycasted-reports = { path = "crates/anycasted-reports" }
anycasted-engine = { path = "." }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
thiserror = "2"
aho-corasick = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }
flate2 = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# ---------------------------------------------------------------------------
# Root package: the analysis pipeline that wires the crates together.
# ---------------------------------------------------------------------------
[package]
name = "anycasted-engine"
description = "Anycasted Diagnostics Engine: evidence-backed Minecraft server log and crash report analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
# Async wrappers (Tokio `spawn_blocking`) for embedding the engine in async services
# such as the future Axum API layer.
async = ["dep:tokio"]

[dependencies]
anycasted-core.workspace = true
anycasted-ingestion.workspace = true
anycasted-parser.workspace = true
anycasted-detection.workspace = true
anycasted-analysis.workspace = true
anycasted-reports.workspace = true
tracing.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
flate2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
